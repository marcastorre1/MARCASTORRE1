<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MARCA.STORRE</title>
<style>
*{box-sizing:border-box;margin:0}
body{background:#070707;color:#fff;font-family:Arial;overflow-x:hidden}
button{cursor:pointer}
nav{height:65px;padding:0 6%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #222}
.logo{font-size:21px;font-weight:bold;user-select:none;-webkit-user-select:none;padding:8px 4px;transition:.2s}
.logo.holding{color:#888}
.cart{background:#fff;border:0;padding:11px 17px;border-radius:8px}
.hero{height:calc(100vh - 65px);min-height:540px;display:flex;align-items:center;padding:0 6%;position:relative;overflow:hidden}
.text{width:48%;z-index:5}
.text small{color:#666}
.text h1{font-size:clamp(48px,7vw,100px);line-height:.83;letter-spacing:-4px;margin:22px 0}
.text h1 span{color:#444}
.text p{color:#777;max-width:400px;line-height:1.6}
.btn{margin-top:18px;padding:13px 18px;border:0;border-radius:7px;font-weight:bold}
.scene{position:absolute;width:min(48vw,560px);height:min(48vw,560px);right:3%;top:50%;transform:translateY(-50%)}
.glow{position:absolute;width:70%;height:70%;left:15%;top:15%;border-radius:50%;background:#fff;filter:blur(90px);opacity:.12}
.rack{position:absolute;width:80%;height:70%;left:10%;top:16%;animation:rack 6s ease-in-out infinite}
.bar{position:absolute;top:5%;width:100%;height:8px;border-radius:20px;background:linear-gradient(90deg,#222,#eee,#333);box-shadow:0 0 25px #fff5}
.leg{position:absolute;top:8%;height:90%;width:6px;background:linear-gradient(#aaa,#222)}
.l{left:5%;transform:rotate(7deg)}.r{right:5%;transform:rotate(-7deg)}
.h{position:absolute;top:10%;width:23%;height:72%;transform-origin:top;animation:cloth 3s ease-in-out infinite}
.h1{left:11%}.h2{left:38%;animation-delay:-1s}.h3{left:65%;animation-delay:-2s}
.hanger{position:absolute;left:28%;top:0;width:45%;height:15%;border:3px solid #aaa;border-bottom:0;border-radius:20px 20px 0 0}
.shirt{position:absolute;top:13%;left:18%;width:64%;height:42%;border-radius:10px 10px 15px 15px;background:linear-gradient(135deg,#444,#050505);box-shadow:10px 18px 25px #000}
.shirt:before,.shirt:after{content:"";position:absolute;top:5%;width:45%;height:65%;background:inherit;border-radius:8px}
.shirt:before{left:-35%;transform:rotate(25deg)}.shirt:after{right:-35%;transform:rotate(-25deg)}
.white{background:linear-gradient(135deg,#fff,#777)}
.hoodie{position:absolute;top:13%;left:12%;width:76%;height:50%;border-radius:15px 15px 22px 22px;background:linear-gradient(135deg,#666,#111);box-shadow:10px 20px 25px #000}
.hoodie:before{content:"";position:absolute;left:30%;top:-5%;width:40%;height:25%;border:3px solid #777;border-radius:50%}
@keyframes rack{0%,100%{transform:rotateY(-5deg) rotateZ(-1deg)}50%{transform:rotateY(5deg) rotateZ(1deg)}}
@keyframes cloth{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
.shop{padding:80px 6%}
.shop h2{font-size:55px;margin:10px 0 30px}.shop h2 span{color:#444}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.product{background:#111;border:1px solid #222;border-radius:10px;overflow:hidden}
.photo{height:250px;background:radial-gradient(circle,#333,#111);display:grid;place-items:center;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.fake{width:120px;height:170px;background:linear-gradient(135deg,#eee,#444);border-radius:12px}
.info{padding:15px}.info small{color:#666}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:5px}
.add{background:#fff;border:0;padding:9px;border-radius:6px}
.drawer,.modal{position:fixed;inset:0;background:#000d;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.box{background:#111;border:1px solid #333;border-radius:12px;padding:25px;width:400px;max-width:90%}
input,select{width:100%;padding:12px;margin:7px 0;background:#191919;color:#fff;border:1px solid #333;border-radius:6px}
.send{width:100%;padding:13px;margin-top:10px;border:0;background:#fff;color:#000;border-radius:6px;font-weight:bold}
.close{background:#222;color:#fff;padding:10px;border:0;margin-top:8px;width:100%;border-radius:6px}
.admin-box{width:600px}
.admin-add{background:#161616;border:1px solid #262626;border-radius:10px;padding:14px;margin-bottom:18px}
.admin-add .fields{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-bottom:10px}
.admin-add .fields input{margin:0}
.img-zone{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.img-preview{width:70px;height:70px;border-radius:8px;background:#0d0d0d;border:1px dashed #333;display:grid;place-items:center;overflow:hidden;font-size:22px;color:#444}
.img-preview img{width:100%;height:100%;object-fit:cover}
.img-controls{flex:1;display:flex;flex-direction:column;gap:6px}
.file-btn{display:block;text-align:center;background:#1f1f1f;color:#ccc;border:1px solid #333;padding:9px;border-radius:6px;font-size:13px;cursor:pointer}
.file-btn input{display:none}
.img-url{margin:0!important;font-size:13px;padding:9px!important}
.add-main-btn{width:100%;background:#fff;color:#000;border:0;padding:12px;border-radius:6px;font-weight:bold}
.admin-list{max-height:400px;overflow-y:auto;margin-bottom:15px}
.admin-item{background:#161616;border:1px solid #262626;border-radius:8px;margin-bottom:8px;padding:10px;display:flex;gap:10px;align-items:center}
.admin-item .thumb{width:52px;height:52px;border-radius:6px;flex-shrink:0;background:#0d0d0d center/cover;border:1px solid #2a2a2a;display:grid;place-items:center;font-size:18px;color:#444;overflow:hidden}
.admin-item .thumb img{width:100%;height:100%;object-fit:cover}
.admin-item .fields{flex:1;display:grid;grid-template-columns:2fr 1fr;gap:6px}
.admin-item .fields input{margin:0;padding:7px;font-size:13px}
.admin-item .actions{display:flex;flex-direction:column;gap:4px}
.admin-item .actions button{border:0;border-radius:5px;padding:6px 9px;font-size:12px}
.btn-img{background:#1a2a3a;color:#7cf}
.btn-del{background:#3a1010;color:#f88}
.empty{color:#555;text-align:center;padding:20px;font-size:13px}
.login-box{width:340px;text-align:center}
.login-box h2{margin-bottom:8px}
.login-box .hint{color:#555;font-size:12px;margin-bottom:16px}
.login-box input{text-align:center;font-size:16px;letter-spacing:3px;margin-bottom:10px}
.login-error{color:#f55;font-size:12px;height:16px;margin-bottom:6px}

/* === КОРЗИНА — товары === */
.cart-item{display:flex;align-items:center;gap:10px;background:#161616;border:1px solid #262626;border-radius:8px;padding:8px;margin-bottom:7px}
.cart-item .ci-img{width:44px;height:44px;border-radius:6px;flex-shrink:0;background:#0d0d0d center/cover;border:1px solid #2a2a2a;overflow:hidden;display:grid;place-items:center;font-size:16px;color:#444}
.cart-item .ci-img img{width:100%;height:100%;object-fit:cover}
.cart-item .ci-info{flex:1;min-width:0}
.cart-item .ci-info b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-item .ci-info small{color:#777;font-size:11px}
.cart-item .ci-del{background:#3a1010;color:#f88;border:1px solid #5a1a1a;border-radius:6px;padding:7px 10px;font-size:14px;flex-shrink:0}
.cart-item .ci-del:hover{background:#4a1515}

@media(max-width:700px){.hero{min-height:520px}.text{width:56%}.text h1{font-size:clamp(40px,10vw,58px);letter-spacing:-3px}.text p{font-size:10px}.btn{font-size:9px;padding:10px}.scene{width:62vw;height:62vw;right:-2%;opacity:.72}.products{grid-template-columns:1fr 1fr}.photo{height:180px}.shop h2{font-size:45px}}
</style>
</head>
<body>

<nav>
<div class="logo" id="logo">marcastorre.</div>
<button class="cart" onclick="openCart()">🛒 <span id="num">0</span></button>
</nav>

<section class="hero">
<div class="text">
<small>MARCA.STORRE / 2026</small>
<h1>WEAR<br><span>YOUR</span><br>MARK.</h1>
<p>Минималистичный streetwear для тех, кто носит свой характер.</p>
<button class="btn" onclick="document.getElementById('shop').scrollIntoView()">СМОТРЕТЬ КОЛЛЕКЦИЮ</button>
</div>
<div class="scene">
<div class="glow"></div>
<div class="rack">
<div class="bar"></div>
<div class="leg l"></div><div class="leg r"></div>
<div class="h h1"><div class="hanger"></div><div class="shirt"></div></div>
<div class="h h2"><div class="hanger"></div><div class="shirt white"></div></div>
<div class="h h3"><div class="hanger"></div><div class="hoodie"></div></div>
</div>
</div>
</section>

<section class="shop" id="shop">
<small style="color:#666">COLLECTION</small>
<h2>THE <span>DROP.</span></h2>
<div class="products" id="products"></div>
</section>

<div class="modal" id="loginBox"><div class="box login-box">
<h2>🔐 ВХОД</h2>
<div class="hint">Введите пароль</div>
<input type="password" id="passInput" placeholder="••••••••" autocomplete="off">
<div class="login-error" id="loginError"></div>
<button class="send" onclick="tryLogin()">ВОЙТИ</button>
<button class="close" onclick="closeLogin()">ОТМЕНА</button>
</div></div>

<div class="modal" id="adminBox"><div class="box admin-box">
<h2>УПРАВЛЕНИЕ КАТАЛОГОМ</h2>
<div class="admin-add">
<div class="fields">
<input id="newName" placeholder="Название">
<input id="newPrice" type="number" placeholder="Цена" min="0">
</div>
<div class="img-zone">
<div class="img-preview" id="newImgPreview">🖼</div>
<div class="img-controls">
<label class="file-btn">📁 Картинка<input type="file" accept="image/*" id="newImgFile"></label>
<input class="img-url" id="newImgUrl" placeholder="или ссылка">
</div>
</div>
<button class="add-main-btn" onclick="addProduct()">+ ДОБАВИТЬ</button>
</div>
<div class="admin-list" id="adminList"></div>
<button class="close" onclick="closeAdmin()">ЗАКРЫТЬ</button>
</div></div>

<div class="drawer" id="cartBox"><div class="box">
<h2>КОРЗИНА</h2>
<div id="items"></div>
<h3>Итого: <span id="sum">0</span> лей</h3>
<button class="send" onclick="order()">ОФОРМИТЬ</button>
<button class="close" onclick="closeCart()">ЗАКРЫТЬ</button>
</div></div>

<div class="modal" id="orderBox"><div class="box">
<h2>ЗАКАЗ</h2>
<div id="orderItems"></div>
<select id="color"><option value="">Цвет</option><option>Чёрный</option><option>Белый</option><option>Серый</option><option>Бежевый</option><option>Синий</option></select>
<select id="size"><option value="">Размер</option><option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option></select>
<h3>Сумма: <span id="orderSum">0</span> лей</h3>
<button class="send" onclick="send()">📲 ЗАКАЗАТЬ В TELEGRAM</button>
<button class="close" onclick="orderBox.style.display='none'">НАЗАД</button>
</div></div>

<script>
const PASS="marca2026",HOLD=1000,MGR="markulik52";
const DEF=[["MARCA BASIC TEE",450,""],["CORE HOODIE",950,""],["LIMITED TEE",0,""],["STREET JACKET",1400,""]];
let products=DEF.slice(),cart=[],isAdmin=false,newImg="",holdT=null;
try{const r=localStorage.getItem('marca_products');if(r){const p=JSON.parse(r);if(Array.isArray(p)){const f=p.filter(x=>Array.isArray(x)&&x.length>=2).map(x=>[String(x[0]||""),Number(x[1])||0,String(x[2]||"")]);if(f.length)products=f;}}}catch(e){localStorage.removeItem('marca_products');}

const $=id=>document.getElementById(id);
const price=p=>p[1]==0?"ПОД ЗАКАЗ":p[1]+" лей";
const save=()=>{try{localStorage.setItem('marca_products',JSON.stringify(products));return true}catch(e){alert("Хранилище переполнено!");return false}};

/* Сумма корзины */
function cartSum(){
  return cart.reduce((s,item)=>s+(item[1]>0?item[1]:0),0);
}

function render(){
  $("products").innerHTML=products.length?products.map((p,i)=>{
    const ph=p[2]?`<img src="${p[2]}">`:`<div class="fake"></div>`;
    return `<div class="product"><div class="photo">${ph}</div><div class="info"><b>${p[0]}</b><br><small>MARCA.STORRE</small><div class="row"><b>${price(p)}</b><button class="add" onclick="add(${i})">В КОРЗИНУ</button></div></div></div>`;
  }).join(""):'<div class="empty" style="grid-column:1/-1">Пусто</div>';
}

function add(i){
  cart.push({...products[i], _id: Date.now() + Math.random()});
  updateCartBadge();
  openCart();
}

function updateCartBadge(){
  $("num").textContent = cart.length;
}

/* ============ КОРЗИНА С УДАЛЕНИЕМ ============ */
function openCart(){
  $("cartBox").style.display="flex";
  renderCart();
}

function renderCart(){
  const items=$("items");
  if(!cart.length){
    items.innerHTML='<div class="empty">Корзина пустая</div>';
  } else {
    items.innerHTML = cart.map((item, idx) => {
      const img = item[2]
        ? `<img src="${item[2]}">`
        : '🖼';
      const p = item[1] == 0 ? "ПОД ЗАКАЗ" : item[1] + " лей";
      return `<div class="cart-item">
        <div class="ci-img">${img}</div>
        <div class="ci-info">
          <b>${item[0]}</b>
          <small>${p}</small>
        </div>
        <button class="ci-del" onclick="removeFromCart(${idx})" title="Убрать">✕</button>
      </div>`;
    }).join("");
  }
  $("sum").textContent = cartSum();
  updateCartBadge();
}

function removeFromCart(idx){
  cart.splice(idx, 1);
  renderCart();
  // если корзина опустела после оформления — закроем окно заказа
  if(!cart.length && $("orderBox").style.display === "flex"){
    $("orderBox").style.display = "none";
  }
  // если открыто окно заказа — обновим содержимое
  if($("orderBox").style.display === "flex"){
    renderOrderItems();
  }
}

function renderOrderItems(){
  $("orderItems").innerHTML = cart.map(item => {
    const p = item[1] == 0 ? "ПОД ЗАКАЗ" : item[1] + " лей";
    return `<p style="margin:8px 0">${item[0]} — ${p}</p>`;
  }).join("");
  $("orderSum").textContent = cartSum();
}

function closeCart(){$("cartBox").style.display="none";}

function order(){
  if(!cart.length){alert("Корзина пустая");return;}
  closeCart();
  $("orderBox").style.display="flex";
  renderOrderItems();
}

function send(){
  if(!cart.length){alert("Корзина пустая");return;}
  const c=$("color").value,s=$("size").value;
  if(!c||!s){alert("Выберите цвет и размер");return;}
  const list=cart.map(x=>x[0]+" — "+(x[1]==0?"ПОД ЗАКАЗ":x[1]+" лей")).join("\n");
  const total=cartSum();
  const text=`🛍 НОВЫЙ ЗАКАЗ MARCA.STORRE\n\n${list}\n\n🎨 Цвет: ${c}\n📏 Размер: ${s}\n\n💰 СУММА: ${total==0?"ПОД ЗАКАЗ":total+" лей"}`;
  location.href="https://t.me/"+MGR+"?text="+encodeURIComponent(text);
}

/* ============ УДЕРЖАНИЕ ЛОГОТИПА ============ */
const logoEl=$("logo");
function startHold(){logoEl.classList.add('holding');holdT=setTimeout(()=>{logoEl.classList.remove('holding');if(navigator.vibrate)navigator.vibrate(30);openLogin();},HOLD);}
function cancelHold(){if(holdT){clearTimeout(holdT);holdT=null;}logoEl.classList.remove('holding');}
logoEl.addEventListener('mousedown',startHold);
logoEl.addEventListener('mouseup',cancelHold);
logoEl.addEventListener('mouseleave',cancelHold);
logoEl.addEventListener('touchstart',startHold,{passive:true});
logoEl.addEventListener('touchend',cancelHold);
logoEl.addEventListener('touchcancel',cancelHold);
logoEl.addEventListener('touchmove',cancelHold);
logoEl.addEventListener('click',e=>e.preventDefault());

/* ============ ВХОД ============ */
function openLogin(){$("loginBox").style.display="flex";$("adminBox").style.display="none";$("loginError").textContent="";$("passInput").value="";setTimeout(()=>$("passInput").focus(),150);}
function closeLogin(){$("loginBox").style.display="none";$("passInput").value="";}
function tryLogin(){
  const v=$("passInput").value.trim().toLowerCase();
  if(v===PASS.toLowerCase()){isAdmin=true;closeLogin();setTimeout(openAdmin,100);}
  else{$("loginError").textContent="Неверный пароль";$("passInput").value="";$("passInput").focus();}
}
$("passInput").addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tryLogin();}});

/* ============ АДМИНКА ============ */
function openAdmin(){if(!isAdmin){openLogin();return;}$("loginBox").style.display="none";$("adminBox").style.display="flex";renderAdmin();}
function closeAdmin(){$("adminBox").style.display="none";isAdmin=false;}

function renderAdmin(){
  const b=$("adminList");
  b.innerHTML=products.length?products.map((p,i)=>{
    const t=p[2]?`<img src="${p[2]}">`:'🖼';
    return `<div class="admin-item"><div class="thumb">${t}</div><div class="fields"><input value="${String(p[0]).replace(/"/g,'&quot;')}" onchange="editName(${i},this.value)"><input type="number" min="0" value="${p[1]}" onchange="editPrice(${i},this.value)"></div><div class="actions"><button class="btn-img" onclick="changeImage(${i})">🖼</button><button class="btn-del" onclick="removeProduct(${i})">✕</button></div></div>`;
  }).join(""):'<div class="empty">Пусто</div>';
}

function compressImage(file,max=700,q=.82){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>{const img=new Image();img.onload=()=>{let{width:w,height:h}=img;if(w>h&&w>max){h=Math.round(h*max/w);w=max}else if(h>max){w=Math.round(w*max/h);h=max}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',q))};img.onerror=rej;img.src=e.target.result};
    r.onerror=rej;r.readAsDataURL(file);
  });
}

$("newImgFile").addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{newImg=await compressImage(f);$("newImgPreview").innerHTML=`<img src="${newImg}">`;$("newImgUrl").value="";}
  catch{alert("Ошибка картинки");}
});

$("newImgUrl").addEventListener('input',e=>{
  const u=e.target.value.trim();
  if(u){newImg="";$("newImgPreview").innerHTML=`<img src="${u}">`;}
  else $("newImgPreview").innerHTML='🖼';
});

function changeImage(i){
  if(!isAdmin)return;
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{products[i][2]=await compressImage(f);if(save()){render();renderAdmin();}}catch{alert("Ошибка");}};
  inp.click();
}

function addProduct(){
  if(!isAdmin)return;
  const n=$("newName").value.trim(),pv=$("newPrice").value.trim(),u=$("newImgUrl").value.trim();
  if(!n){alert("Введите название");return;}
  const pn=pv===""?0:parseInt(pv);
  if(isNaN(pn)||pn<0){alert("Плохая цена");return;}
  products.push([n,pn,newImg||u||""]);
  if(!save()){products.pop();return;}
  render();renderAdmin();
  $("newName").value="";$("newPrice").value="";$("newImgUrl").value="";$("newImgFile").value="";$("newImgPreview").innerHTML='🖼';newImg="";
}

function editName(i,v){if(!isAdmin)return;v=v.trim();if(!v){renderAdmin();return;}products[i][0]=v;save();render();}
function editPrice(i,v){if(!isAdmin)return;const n=parseInt(v);if(isNaN(n)||n<0){renderAdmin();return;}products[i][1]=n;save();render();}
function removeProduct(i){if(!isAdmin)return;if(!confirm(`Удалить "${products[i][0]}"?`))return;products.splice(i,1);save();render();renderAdmin();}

render();
</script>
</body>
</html>
