<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MARCA.STORRE</title>

<style>
*{box-sizing:border-box;margin:0}
body{background:#070707;color:#fff;font-family:Arial;overflow-x:hidden}
button{cursor:pointer}

nav{
height:65px;padding:0 6%;display:flex;
align-items:center;justify-content:space-between;
border-bottom:1px solid #222
}
.logo{
font-size:21px;font-weight:bold;
cursor:default;
-webkit-user-select:none;-moz-user-select:none;user-select:none;
-webkit-tap-highlight-color:transparent;
padding:8px 4px;transition:color .2s
}
.logo.holding{color:#888}
.cart{background:#fff;border:0;padding:11px 17px;border-radius:8px}

.hero{
height:calc(100vh - 65px);min-height:540px;
display:flex;align-items:center;padding:0 6%;
position:relative;overflow:hidden
}
.text{width:48%;z-index:5}
.text small{color:#666}
.text h1{
font-size:clamp(48px,7vw,100px);
line-height:.83;letter-spacing:-4px;margin:22px 0
}
.text h1 span{color:#444}
.text p{color:#777;max-width:400px;line-height:1.6}
.btn{margin-top:18px;padding:13px 18px;border:0;border-radius:7px;font-weight:bold}

.scene{
position:absolute;width:min(48vw,560px);height:min(48vw,560px);
right:3%;top:50%;transform:translateY(-50%)
}
.glow{
position:absolute;width:70%;height:70%;left:15%;top:15%;
border-radius:50%;background:white;filter:blur(90px);opacity:.12
}
.rack{
position:absolute;width:80%;height:70%;left:10%;top:16%;
animation:rack 6s ease-in-out infinite
}
.bar{
position:absolute;top:5%;width:100%;height:8px;border-radius:20px;
background:linear-gradient(90deg,#222,#eee,#333);
box-shadow:0 0 25px #fff5
}
.leg{
position:absolute;top:8%;height:90%;width:6px;
background:linear-gradient(#aaa,#222)
}
.l{left:5%;transform:rotate(7deg)}
.r{right:5%;transform:rotate(-7deg)}

.h{
position:absolute;top:10%;width:23%;height:72%;
transform-origin:top;animation:cloth 3s ease-in-out infinite
}
.h1{left:11%}
.h2{left:38%;animation-delay:-1s}
.h3{left:65%;animation-delay:-2s}

.hanger{
position:absolute;left:28%;top:0;width:45%;height:15%;
border:3px solid #aaa;border-bottom:0;border-radius:20px 20px 0 0
}

.shirt{
position:absolute;top:13%;left:18%;width:64%;height:42%;
border-radius:10px 10px 15px 15px;
background:linear-gradient(135deg,#444,#050505);
box-shadow:10px 18px 25px #000
}
.shirt:before,.shirt:after{
content:"";position:absolute;top:5%;width:45%;height:65%;
background:inherit;border-radius:8px
}
.shirt:before{left:-35%;transform:rotate(25deg)}
.shirt:after{right:-35%;transform:rotate(-25deg)}
.white{background:linear-gradient(135deg,#fff,#777)}

.hoodie{
position:absolute;top:13%;left:12%;width:76%;height:50%;
border-radius:15px 15px 22px 22px;
background:linear-gradient(135deg,#666,#111);
box-shadow:10px 20px 25px #000
}
.hoodie:before{
content:"";position:absolute;left:30%;top:-5%;
width:40%;height:25%;border:3px solid #777;border-radius:50%
}

@keyframes rack{
0%,100%{transform:rotateY(-5deg) rotateZ(-1deg)}
50%{transform:rotateY(5deg) rotateZ(1deg)}
}
@keyframes cloth{
0%,100%{transform:rotate(-3deg)}
50%{transform:rotate(4deg)}
}

.shop{padding:80px 6%}
.shop h2{font-size:55px;margin:10px 0 30px}
.shop h2 span{color:#444}
.products{
display:grid;grid-template-columns:repeat(4,1fr);gap:12px
}
.product{
background:#111;border:1px solid #222;border-radius:10px;overflow:hidden
}
.photo{
height:250px;background:radial-gradient(circle,#333,#111);
display:grid;place-items:center
}
.fake{
width:120px;height:170px;
background:linear-gradient(135deg,#eee,#444);
border-radius:12px
}
.info{padding:15px}
.info small{color:#666}
.row{
display:flex;justify-content:space-between;
align-items:center;margin-top:12px;gap:5px
}
.add{background:#fff;border:0;padding:9px;border-radius:6px}

.drawer,.modal{
position:fixed;inset:0;background:#000d;z-index:20;
display:none;align-items:center;justify-content:center;
padding:20px;overflow-y:auto
}
.box{
background:#111;border:1px solid #333;border-radius:12px;
padding:25px;width:400px;max-width:90%
}
input,select{
width:100%;padding:12px;margin:7px 0;
background:#191919;color:white;border:1px solid #333;border-radius:6px
}
.send{
width:100%;padding:13px;margin-top:10px;border:0;
background:#fff;color:#000;border-radius:6px;font-weight:bold
}
.close{
background:#222;color:white;padding:10px;border:0;
margin-top:8px;width:100%;border-radius:6px
}

/* ===== АДМИН-ПАНЕЛЬ ===== */
.admin-box{width:520px}
.admin-box h2{margin-bottom:5px}
.admin-box .sub{color:#666;font-size:12px;margin-bottom:18px}
.admin-form{
display:grid;grid-template-columns:2fr 1fr auto;gap:8px;
margin-bottom:20px
}
.admin-form input{margin:0}
.admin-form button{
background:#fff;color:#000;border:0;padding:0 18px;
border-radius:6px;font-weight:bold
}
.admin-list{max-height:340px;overflow-y:auto;margin-bottom:15px}
.admin-item{
display:flex;justify-content:space-between;align-items:center;
padding:10px;background:#161616;border:1px solid #262626;
border-radius:8px;margin-bottom:7px;gap:8px
}
.admin-item input{
margin:0;flex:1;padding:8px;font-size:13px
}
.admin-item button{
background:#3a1010;color:#f88;border:1px solid #5a1a1a;
padding:8px 12px;border-radius:6px;font-size:13px
}
.admin-item button:hover{background:#4a1515}
.empty{
color:#555;text-align:center;padding:20px;font-size:13px
}

/* ===== ОКНО ПАРОЛЯ ===== */
.login-box{width:340px;text-align:center}
.login-box h2{margin-bottom:8px;font-size:22px}
.login-box .hint{color:#555;font-size:12px;margin-bottom:16px}
.login-box input{
text-align:center;font-size:16px;letter-spacing:3px;margin-bottom:10px
}
.login-error{
color:#f55;font-size:12px;height:16px;margin-bottom:6px
}

@media(max-width:700px){
.hero{min-height:520px}
.text{width:56%}
.text h1{
font-size:clamp(40px,10vw,58px);
letter-spacing:-3px
}
.text p{font-size:10px}
.btn{font-size:9px;padding:10px}
.scene{
width:62vw;height:62vw;
right:-2%;opacity:.72
}
.products{grid-template-columns:1fr 1fr}
.photo{height:180px}
.shop h2{font-size:45px}
.admin-form{grid-template-columns:1fr 1fr}
.admin-form button{padding:12px}
}

@media(max-width:400px){
.text{width:58%}
.text h1{font-size:39px}
.scene{right:-12%;opacity:.58}
}
</style>
</head>

<body>

<nav>
<div class="logo" id="logo">marcastorre.</div>
<button class="cart" onclick="openCart()">
🛒 <span id="num">0</span>
</button>
</nav>

<section class="hero">

<div class="text">
<small>MARCA.STORRE / 2026</small>

<h1>
WEAR<br>
<span>YOUR</span><br>
MARK.
</h1>

<p>
Минималистичный streetwear для тех,
кто носит свой характер.
</p>

<button class="btn"
onclick="document.getElementById('shop').scrollIntoView()">
СМОТРЕТЬ КОЛЛЕКЦИЮ
</button>
</div>

<div class="scene">

<div class="glow"></div>

<div class="rack">

<div class="bar"></div>
<div class="leg l"></div>
<div class="leg r"></div>

<div class="h h1">
<div class="hanger"></div>
<div class="shirt"></div>
</div>

<div class="h h2">
<div class="hanger"></div>
<div class="shirt white"></div>
</div>

<div class="h h3">
<div class="hanger"></div>
<div class="hoodie"></div>
</div>

</div>
</div>

</section>

<section class="shop" id="shop">

<small style="color:#666">COLLECTION</small>
<h2>THE <span>DROP.</span></h2>

<div class="products" id="products"></div>

</section>

<!-- ===== ОКНО ВХОДА В АДМИНКУ ===== -->
<div class="modal" id="loginBox">
<div class="box login-box">

<h2>🔐 ВХОД</h2>
<div class="hint">Введите пароль администратора</div>

<input type="password" id="passInput" placeholder="••••••••" autocomplete="off">
<div class="login-error" id="loginError"></div>

<button class="send" onclick="tryLogin()">ВОЙТИ</button>
<button class="close" onclick="closeLogin()">ОТМЕНА</button>

</div>
</div>

<!-- ===== АДМИН-ПАНЕЛЬ ===== -->
<div class="modal" id="adminBox">
<div class="box admin-box">

<h2>УПРАВЛЕНИЕ КАТАЛОГОМ</h2>
<div class="sub">Добавляй, редактируй и удаляй товары</div>

<div class="admin-form">
<input id="newName" placeholder="Название товара">
<input id="newPrice" type="number" placeholder="Цена" min="0">
<button onclick="addProduct()">+</button>
</div>

<div class="admin-list" id="adminList"></div>

<button class="close" onclick="closeAdmin()">ЗАКРЫТЬ</button>

</div>
</div>

<!-- КОРЗИНА -->

<div class="drawer" id="cartBox">

<div class="box">

<h2>КОРЗИНА</h2>

<div id="items"></div>

<h3>
Итого: <span id="sum">0</span> лей
</h3>

<button class="send" onclick="order()">
ОФОРМИТЬ ЗАКАЗ
</button>

<button class="close" onclick="closeCart()">
ЗАКРЫТЬ
</button>

</div>
</div>

<!-- ЗАКАЗ -->

<div class="modal" id="orderBox">

<div class="box">

<h2>ЗАКАЗ</h2>

<div id="orderItems"></div>

<select id="color">
<option value="">Цвет</option>
<option>Чёрный</option>
<option>Белый</option>
<option>Серый</option>
<option>Бежевый</option>
<option>Синий</option>
</select>

<select id="size">
<option value="">Размер</option>
<option>XS</option>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
<option>XXL</option>
</select>

<h3>
Сумма: <span id="orderSum">0</span> лей
</h3>

<button class="send" onclick="send()">
📲 ЗАКАЗАТЬ В TELEGRAM
</button>

<button class="close" onclick="orderBox.style.display='none'">
НАЗАД
</button>

</div>
</div>

<script>

/* ============================================================
   ⚠️ НАСТРОЙКИ АДМИНА
   ============================================================ */

// Пароль для входа в админку
const ADMIN_PASSWORD = "MARCA2026";

// Сколько миллисекунд нужно УДЕРЖИВАТЬ логотип
const HOLD_TIME = 1000; // 1 секунда

// Сколько минут помнить вход после ввода пароля
const SESSION_MINUTES = 30;

/* ============================================================
   КОНЕЦ НАСТРОЕК
   ============================================================ */

const manager = "markulik52";

/* ===== КАТАЛОГ ===== */
/* ЦЕНА 0 = ПОД ЗАКАЗ */

let products = JSON.parse(localStorage.getItem('marca_products')) || [
  ["MARCA BASIC TEE", 450],
  ["CORE HOODIE", 950],
  ["LIMITED TEE", 0],
  ["STREET JACKET", 1400]
];

let cart = [], sum = 0;
let isAdmin = false;

const productsBox = document.getElementById("products");

function saveProducts(){
  localStorage.setItem('marca_products', JSON.stringify(products));
}

function price(p){
  return p[1] == 0 ? "ПОД ЗАКАЗ" : p[1] + " лей";
}

function render(){
  productsBox.innerHTML = "";
  if(!products.length){
    productsBox.innerHTML = '<div class="empty" style="grid-column:1/-1">Каталог пуст</div>';
    return;
  }
  products.forEach((p, i) => {
    productsBox.innerHTML += `
      <div class="product">
        <div class="photo"><div class="fake"></div></div>
        <div class="info">
          <b>${p[0]}</b><br>
          <small>MARCA.STORRE</small>
          <div class="row">
            <b>${price(p)}</b>
            <button class="add" onclick="add(${i})">В КОРЗИНУ</button>
          </div>
        </div>
      </div>
    `;
  });
}

function add(i){
  cart.push(products[i]);
  if(products[i][1] > 0) sum += products[i][1];
  document.getElementById("num").textContent = cart.length;
  openCart();
}

/* ===== УДЕРЖАНИЕ ЛОГОТИПА ===== */

const logoEl = document.getElementById("logo");
let holdTimer = null;
let holdTriggered = false;

function startHold(){
  holdTriggered = false;
  logoEl.classList.add('holding');
  holdTimer = setTimeout(() => {
    holdTriggered = true;
    logoEl.classList.remove('holding');
    // лёгкая вибрация на телефоне (если поддерживается)
    if(navigator.vibrate) navigator.vibrate(30);
    openLogin();
  }, HOLD_TIME);
}

function cancelHold(){
  if(holdTimer){
    clearTimeout(holdTimer);
    holdTimer = null;
  }
  logoEl.classList.remove('holding');
}

// Мышь
logoEl.addEventListener('mousedown', startHold);
logoEl.addEventListener('mouseup', cancelHold);
logoEl.addEventListener('mouseleave', cancelHold);

// Тач (телефон)
logoEl.addEventListener('touchstart', e => { startHold(); }, {passive:true});
logoEl.addEventListener('touchend', cancelHold);
logoEl.addEventListener('touchcancel', cancelHold);
logoEl.addEventListener('touchmove', cancelHold);

// Запрет обычного клика по логотипу (ничего не делает)
logoEl.addEventListener('click', e => e.preventDefault());

/* ===== ОКНО ПАРОЛЯ ===== */

function openLogin(){
  if(isAdmin){ openAdmin(); return; }

  document.getElementById("loginBox").style.display = "flex";
  document.getElementById("loginError").textContent = "";
  document.getElementById("passInput").value = "";

  setTimeout(() => document.getElementById("passInput").focus(), 100);
}

function closeLogin(){
  document.getElementById("loginBox").style.display = "none";
}

function tryLogin(){
  const val = document.getElementById("passInput").value;
  if(val === ADMIN_PASSWORD){
    isAdmin = true;
    localStorage.setItem('marca_admin_until', Date.now() + SESSION_MINUTES * 60 * 1000);
    closeLogin();
    openAdmin();
  } else {
    document.getElementById("loginError").textContent = "Неверный пароль";
    document.getElementById("passInput").value = "";
  }
}

document.getElementById("passInput").addEventListener('keydown', e => {
  if(e.key === 'Enter') tryLogin();
});

// Проверка активной сессии при загрузке
(function checkSession(){
  const until = parseInt(localStorage.getItem('marca_admin_until') || '0');
  if(until > Date.now()) isAdmin = true;
})();

/* ===== АДМИН-ПАНЕЛЬ ===== */

function openAdmin(){
  if(!isAdmin){ openLogin(); return; }
  document.getElementById("adminBox").style.display = "flex";
  renderAdmin();
}

function closeAdmin(){
  document.getElementById("adminBox").style.display = "none";
}

function renderAdmin(){
  const box = document.getElementById("adminList");
  if(!products.length){
    box.innerHTML = '<div class="empty">Товаров пока нет</div>';
    return;
  }
  box.innerHTML = products.map((p, i) => `
    <div class="admin-item">
      <input value="${p[0]}" onchange="editName(${i}, this.value)" placeholder="Название">
      <input type="number" min="0" value="${p[1]}" onchange="editPrice(${i}, this.value)" style="max-width:90px">
      <button onclick="removeProduct(${i})">✕</button>
    </div>
  `).join("");
}

function addProduct(){
  if(!isAdmin) return;

  const name = document.getElementById("newName").value.trim();
  const priceVal = document.getElementById("newPrice").value.trim();

  if(!name){ alert("Введите название товара"); return; }

  const priceNum = priceVal === "" ? 0 : parseInt(priceVal);
  if(isNaN(priceNum) || priceNum < 0){ alert("Некорректная цена"); return; }

  products.push([name, priceNum]);
  saveProducts();
  render();
  renderAdmin();

  document.getElementById("newName").value = "";
  document.getElementById("newPrice").value = "";
}

function editName(i, val){
  if(!isAdmin) return;
  const v = val.trim();
  if(!v){ alert("Название не может быть пустым"); renderAdmin(); return; }
  products[i][0] = v;
  saveProducts();
  render();
}

function editPrice(i, val){
  if(!isAdmin) return;
  const n = parseInt(val);
  if(isNaN(n) || n < 0){ alert("Некорректная цена"); renderAdmin(); return; }
  products[i][1] = n;
  saveProducts();
  render();
}

function removeProduct(i){
  if(!isAdmin) return;
  if(!confirm(`Удалить "${products[i][0]}"?`)) return;
  products.splice(i, 1);
  saveProducts();
  render();
  renderAdmin();
}

/* ===== КОРЗИНА ===== */

function openCart(){
  document.getElementById("cartBox").style.display = "flex";
  document.getElementById("sum").textContent = sum;
  document.getElementById("items").innerHTML =
    cart.map(x => `<p style="margin:8px 0">${x[0]} — ${price(x)}</p>`).join("")
    || "Корзина пустая";
}

function closeCart(){
  document.getElementById("cartBox").style.display = "none";
}

function order(){
  if(!cart.length){ alert("Корзина пустая"); return; }
  closeCart();
  document.getElementById("orderBox").style.display = "flex";
  document.getElementById("orderItems").innerHTML =
    cart.map(x => `<p style="margin:8px 0">${x[0]} — ${price(x)}</p>`).join("");
  document.getElementById("orderSum").textContent = sum;
}

function send(){
  let c = document.getElementById("color").value;
  let s = document.getElementById("size").value;

  if(!c || !s){ alert("Выберите цвет и размер"); return; }

  let list = cart.map(x => x[0] + " — " + price(x)).join("\n");

  let text = `🛍 НОВЫЙ ЗАКАЗ MARCA.STORRE

${list}

🎨 Цвет: ${c}
📏 Размер: ${s}

💰 СУММА: ${sum == 0 ? "ПОД ЗАКАЗ" : sum + " лей"}`;

  location.href = "https://t.me/" + manager + "?text=" + encodeURIComponent(text);
}

render();

</script>

</body>
</html>
